spring.application.name=hablabar-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hablabar}
spring.datasource.username=${DB_USERNAME:hablabar}
spring.datasource.password=${DB_PASSWORD:hablabar_dev}

# Solo para desarrollo local. Antes de desplegar, usar migraciones de esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8443,http://127.0.0.1:8443}

app.jwt.secret=${JWT_SECRET:hablabar-clave-solo-para-desarrollo-0123456789}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}
