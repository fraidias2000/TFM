services:
  db:
    image: postgres:17-alpine
    container_name: hablabar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hablabar}
      POSTGRES_USER: ${DB_USERNAME:-hablabar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hablabar_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hablabar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hablabar} -d ${POSTGRES_DB:-hablabar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hablabar-postgres-data:
